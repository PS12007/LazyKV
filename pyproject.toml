[project]
name = "lazykv"
version = "0.0.1"
description = "Tiered KV-cache runtime and residency-policy study for long-context inference on one 8 GB consumer GPU"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Blackwell (sm_120) needs a cu128+ build; the exact pinned wheel is in requirements.lock.
    "torch==2.12.0",
    # Pinned because LazyKV subclasses transformers.Cache and patches one attention forward;
    # that internal API moves between releases.
    "transformers==5.16.1",
    "numpy==2.5.2",
    "pyyaml==6.0.3",
    "matplotlib==3.11.1",
]

[project.urls]
Repository = "https://github.com/PS12007/LazyKV"
"Research log" = "https://github.com/PS12007/LazyKV/blob/main/docs/RESEARCH_LOG.md"

[project.optional-dependencies]
dev = ["pytest==9.1.1"]
# Only for the 3B stress model: 4-bit weights are what let a 3B model and a 32K KV cache share 8 GB.
# Verified on this machine's Blackwell GPU (sm_120) with torch 2.12.0+cu130 before it was adopted.
# transformers loads any bitsandbytes 4-bit model through accelerate, so it comes with it.
quant = ["bitsandbytes==0.50.2", "accelerate==1.15.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
