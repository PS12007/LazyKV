# Phase 12 pilot: can the full cache do RULER's variable tracking and common words extraction?
#
# Retention is a policy's score over the full cache's. If Llama-3.2-1B scores near zero on a task
# with the full cache, no policy's retention on it is measurable, and running the ladder on it would
# produce noise that looks like a result. RULER's own paper reports small models failing its
# aggregation tasks at long context, so this is checked first, cheaply, rather than assumed.
#
# Full cache and the 100% block-pool control only, a few prompts per kind, at three contexts. The
# Phase 12 config picks its contexts and kinds from this, and the Phase 12 report quotes it.
phase: phase12_pilot

model:
  repo: unsloth/Llama-3.2-1B-Instruct
  revision: 5a8abab4a5d6f164389b1079fb721cfab8d7126c

block_size: 64
prefill_chunk: 2048
context: 32768

budgets: []
policies: []

niah:
  book: moby_dick
  kinds: [vt, cwe]
  depths: [0.0, 0.5, 1.0]
  samples: 2
  # RULER's tokens_to_generate per task (constants.py).
  max_new_tokens: {vt: 30, cwe: 120}
  seed: 0

teacher_forced:
  book: pride_and_prejudice
  offsets: [0]
  continuation: 256
