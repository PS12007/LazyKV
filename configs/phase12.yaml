# Phase 12: residency policies on RULER's harder tasks, beside an in-run single-needle control.
#
# Every earlier phase judged the ladder by needle retrieval: the answer sits in one or a few blocks,
# and the question says what to look for. RULER's variable tracking (vt) removes both: the answer is
# a five-hop chain, and only the first hop contains the value the question names, so the blocks a
# policy must keep only become recognizable as the answer is generated. Common words extraction
# (cwe) spreads the evidence over the whole context. If query-aware selection has a failure mode the
# needle hid, these are where it shows.
#
# Rule fixed before the pilot's 16K/8K/4K results were read (the 32K pilot was already seen: vt
# viable, cwe at the floor): a kind is run at a context only if the pilot's full cache scores at
# least `viability_floor` there. Below it, a retention is a ratio of noise. The kinds and contexts
# actually run are listed in the chain and derived in the analysis from the pilot, not chosen here.
#
# In-run control: the single-needle kind runs in the same invocation, so a rung's retention on the
# hard kind is compared with its retention on the easy one under the same commit and prompts
# machinery, not against another phase's numbers.
#
# Policies: rungs 2, 4, 5. Rungs 6-7 are rung 5's answers bit for bit (Phase 4); rung 8 is within
# noise of rung 5 (Phase 5); rung 9 is exact. Samples 0-1 of vt repeat the pilot's prompts, so the
# first two samples double as a reproducibility check on the full cache.
phase: phase12

model:
  repo: unsloth/Llama-3.2-1B-Instruct
  revision: 5a8abab4a5d6f164389b1079fb721cfab8d7126c

block_size: 64
prefill_chunk: 2048
context: 32768

budgets: [0.75, 0.5, 0.25, 0.125, 0.0625]
policies: [window_sink, h2o, quest]

h2o:
  stride: 32
  query_batch: 4

niah:
  book: moby_dick
  kinds: [single, vt]
  depths: [0.0, 0.25, 0.5, 0.75, 1.0]
  samples: 6
  # RULER's tokens_to_generate for vt and cwe; the study's usual 16 for the single needle.
  max_new_tokens: {single: 16, vt: 30, cwe: 120}
  seed: 0

teacher_forced:
  book: pride_and_prejudice
  offsets: [0]
  continuation: 256

viability_floor: 0.5
hard_kind: vt
control_kind: single

bootstrap:
  iters: 10000
  seed: 0
