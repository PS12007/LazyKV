# Phase 5 gate: rung 8, the int8 warm/cold tier, against rung 6 on the Phase 4 sweep. Everything
# except `phase` and `policies` is Phase 4's, so the two rungs are measured on identical prompts,
# budgets and block size and the comparison is within one run.
#
# `quest` (rung 5) is not re-measured here: Phase 4 established that rung 6 reproduces it bit for
# bit, so `tiered_sync` *is* the exact reference, and the run's `full` condition carries the
# full-cache baseline. Rung 7 is left out because Phase 4 measured it slower than rung 6 with no
# quality difference, so rung 8 is built on rung 6 (see lazykv/tiered.py).
phase: phase5

model:
  repo: unsloth/Llama-3.2-1B-Instruct
  revision: 5a8abab4a5d6f164389b1079fb721cfab8d7126c

block_size: 64
context: 32768
prefill_chunk: 2048

budgets: [0.75, 0.5, 0.25, 0.125, 0.0625]
# tiered_sync: rung 6, exact, bf16 host pool. tiered_int8: rung 8, the same selection and the same
# VRAM slots, with the host pool narrowed to int8 and widened again on arrival.
policies: [tiered_sync, tiered_int8]

# Phase 4's chosen tier configuration. Rung 8 always gathers (it has nowhere else to dequantize),
# so `fetch` applies to rung 6 and the two rungs share the mechanism.
tier:
  fetch: gather
  spare: 1.0

niah:
  book: moby_dick
  kinds: [single, multikey, multivalue]
  depths: [0.0, 0.25, 0.5, 0.75, 1.0]
  samples: 3
  max_new_tokens: {single: 16, multikey: 16, multivalue: 48}
  seed: 0

teacher_forced:
  book: pride_and_prejudice
  offsets: [0, 60000]
  continuation: 256

speed:
  book: moby_dick
  repeats: 3
  warmup_steps: 5
  decode_tokens: 128
