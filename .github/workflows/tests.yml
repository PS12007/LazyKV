name: tests

# CPU-only: the CUDA tests skip, and what runs is the analysis, statistics, CPU paths and the
# docs-freshness check that keeps every number in the markdown tied to results/**/metrics.json.
# Windows because that is the only platform the study ran on (harness/host.py uses Win32 APIs).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Create env
        run: uv venv --python 3.12 .venv
      - name: Install CPU torch and the project
        run: |
          uv pip install --python .venv\Scripts\python.exe torch==2.12.0 --index-url https://download.pytorch.org/whl/cpu
          uv pip install --python .venv\Scripts\python.exe -r pyproject.toml --extra dev
      - name: Test
        run: .venv\Scripts\python.exe -m pytest
